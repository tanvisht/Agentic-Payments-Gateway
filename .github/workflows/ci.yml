name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: agentpay demo

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i --prefix /tmp/solc solc@0.8.28
      - run: SOLC_PATH=/tmp/solc/node_modules/solc node contracts/build.mjs
      - name: Artifacts are reproducible from source
        run: git diff --exit-code contracts/artifacts

  postgres:
    runs-on: ubuntu-latest
    services:
      contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i --prefix /tmp/solc solc@0.8.28
      - run: SOLC_PATH=/tmp/solc/node_modules/solc node contracts/build.mjs
      - name: Artifacts are reproducible from source
        run: git diff --exit-code contracts/artifacts

  postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTPAY_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/agentpay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: pytest
