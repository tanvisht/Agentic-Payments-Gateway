[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpay"
version = "0.1.0"
description = "Contactless agentic payment gateway: mandate-bound, provider-agnostic payments for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "cryptography>=42",
  "stripe>=10",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agentpay = "agentpay.cli:main"

[tool.setuptools.packages.find]
include = ["agentpay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
